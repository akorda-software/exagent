name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXAGENT_OFFLINE: "1"
  MIX_ENV: test

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "25"
          - elixir: "1.17"
            otp: "26"
          - elixir: "1.18"
            otp: "26"
          - elixir: "1.18"
            otp: "27"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile, format and offline suite (warnings as errors)
        run: elixir test/support/testing_audit_harness_ci.exs suite "$RUNNER_TEMP/exagent-suite"

      - name: Preserve command exits, warnings and test totals/exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.elixir }}-otp-${{ matrix.otp }}
          path: ${{ runner.temp }}/exagent-suite

  harness:
    name: Finite harness / Elixir 1.20 / OTP 29
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Install dependencies
        run: mix deps.get
      - name: C0, documentation snippets, isolated R3, evals and load smoke
        run: elixir test/support/testing_audit_harness_ci.exs harness "$RUNNER_TEMP/exagent-harness"
      - name: Preserve finite harness evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-1.20-otp-29
          path: ${{ runner.temp }}/exagent-harness

  # TAR consumer CI remains pending: package_acceptance.exs currently requires a
  # new /tmp/opencode/exagent-night-package* directory and isolated Hex/Rebar
  # bootstrap. Porting that bootstrap needs a separately reviewed scope; root
  # tests do not certify none/API/SDK/exporter consumer graphs or their warnings.
